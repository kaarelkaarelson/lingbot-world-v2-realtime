[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-world-v2-realtime"
version = "0.1.0"
description = "LingBot-World 2.0 1.3B at 16.2 FPS on one RTX 5090: upstream + inference kernels"
authors = [
    { name = "Robbyant Team" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "imageio-ffmpeg",
    "flash_attn",
    "numpy>=1.23.5,<2",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]"
]

[project.scripts]
lingbot = "lingbot.cli:main"

[project.urls]
homepage = "https://technology.robbyant.com/lingbot-world-v2"
documentation = "https://github.com/robbyant/lingbot-world-v2"
repository = "https://github.com/robbyant/lingbot-world-v2"
huggingface = "https://huggingface.co/robbyant/lingbot-world-v2-base-cam"

[tool.setuptools.packages.find]
include = ["lingbot*"]  # reference/ (the paper's `wan`) is put on sys.path by lingbot/__init__.py; install with -e

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true


